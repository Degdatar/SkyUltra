; SkyUltra settings. The in-game Settings page writes browser choices to this file.
; You can also edit Data\SKSE\Plugins\SkyUltra.ini in the active mod, then restart Skyrim.
; MainWidth=0 and MainHeight=0 use Skyrim's full display resolution for sharp text.
; Set explicit main dimensions to trade image quality for lower browser rendering cost.
; Main and popup frame rates default to 0 (follow the active display refresh).
; Set either value to 30, 60, 90, 120, 144, 165, or 240 to cap that view.
; Renderer recovery is not manually simulated. It only runs when Skyrim replaces
; or removes its D3D11 device.

[Development]
; Reload manifest-backed web views after files change under Data\SkyUltra. Leave off for normal play.
HotReload=0

[Performance]
MainWidth=0
MainHeight=0
MainFPS=0
PopupWidth=420
PopupHeight=240
PopupFPS=0

; Browser keys are added by the in-game Settings page under [Browser].

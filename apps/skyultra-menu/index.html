<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#08111a" />
  <meta name="description" content="SkyUltra Field Atlas: a live Skyrim interface, actor observatory, HUD builder and reusable UI kit." />
  <title>SkyUltra · The Field Atlas</title>
  <style>
    :root{color-scheme:dark;font-family:"Segoe UI",Arial,sans-serif}html,body,#root{height:100%;margin:0;background:transparent;color:#deebee}body{-webkit-user-select:none;user-select:none}
    #skyultra-boot{box-sizing:border-box;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:40px;background:#000}
    #skyultra-boot.boot-loading .boot-content{visibility:hidden}
    .boot-content{width:min(700px,85vw);display:flex;flex-direction:column;align-items:center;text-align:center}.boot-logo{display:block;width:100%;max-width:360px;height:auto;object-fit:contain}.boot-title{font:400 28px Georgia,serif;margin:0;color:#edf1ec}.boot-status{margin:18px 0 0;color:#9db6c2;font-size:12px;line-height:1.8}.boot-note{margin-top:18px;color:#8da5b2;font-size:12px;line-height:1.8}.boot-retry{padding:8px 16px;margin-top:16px;border:1px solid #b69e70;background:#12232f;color:#ebd5ac;cursor:pointer}
  </style>
</head>
<body>
  <div id="root"><main id="skyultra-boot" class="boot-loading" aria-label="Loading SkyUltra" aria-live="polite">
    <!-- The native compositor owns the opening video. Keep page startup unbranded. -->
    <section class="boot-content"><p class="boot-status" id="boot-status">Loading interface…</p><p class="boot-note" id="boot-note"></p><button class="boot-retry" id="boot-retry" hidden onclick="location.reload()">Retry loading</button></section>
  </main></div>
  <script>
    function skyUltraBootError(){var status=document.getElementById('boot-status');if(!status)return;document.getElementById('skyultra-boot').classList.remove('boot-loading');status.textContent='The interface could not finish loading.';document.getElementById('boot-note').textContent='Retry, or check SkyUltra.log and the browser log for the failed resource.';document.getElementById('boot-retry').hidden=false;}
    window.addEventListener('error',function(event){if(event.target&&event.target.tagName==='IMG')return;skyUltraBootError();},true);
    window.addEventListener('unhandledrejection',skyUltraBootError);
  </script>
  <script type="module" src="./src/main.tsx"></script>
</body>
</html>
